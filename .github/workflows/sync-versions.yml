name: Sync CCS Versions

on:
  # Docker documentation updates do not directly dispatch this workflow.
  schedule:
    - cron: '17 4 * * 0'
  push:
    branches: [main]
  repository_dispatch:
    types: [new-ccs-version]
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: 'Republish explicitly selected deployed Action tags using this source revision'
        type: boolean
        default: false
      versions:
        description: 'Comma-separated deployed full toolchain versions (required for refresh)'
        type: string
        default: ''

concurrency:
  group: sync-toolchain-versions
  cancel-in-progress: false

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Fetch confirmed available versions
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/uoohyo/docker-ccstudio-ide/main/docs/versions.md \
            --output /tmp/versions.md
      - name: Reconcile tags, releases, and aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_existing || false }}
          SELECTED_VERSIONS: ${{ inputs.versions }}
          BACKUP_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          REFRESH_ARGS=()
          if [ "$REFRESH_EXISTING" = "true" ]; then
            REFRESH_ARGS+=(--refresh-existing --selected-versions "$SELECTED_VERSIONS" --backup-id "$BACKUP_ID")
          fi
          python3 .github/scripts/sync_versions.py --kind ccs --versions-file /tmp/versions.md "${REFRESH_ARGS[@]}"
      - name: Preserve reconciliation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-sync-results
          path: |
            sync-results.json
            refresh-ledger.json
          if-no-files-found: warn
          retention-days: 90

      - name: Update README badge
        run: |
          VERSIONS=$(python3 -c "import sys; sys.path.insert(0, '.github/scripts'); from sync_versions import available_versions; print('\n'.join(available_versions(open('/tmp/versions.md').read(), 4)))")
          # Get oldest and newest versions from all fetched versions
          OLDEST=$(echo "$VERSIONS" | head -1)
          NEWEST=$(echo "$VERSIONS" | tail -1)

          if [ -z "$OLDEST" ] || [ -z "$NEWEST" ]; then
            echo "⚠️ Could not determine version range, skipping README update"
            exit 0
          fi

          # Extract major.minor versions
          OLDEST_SHORT=$(echo "$OLDEST" | grep -oE '^[0-9]+\.[0-9]+')
          NEWEST_SHORT=$(echo "$NEWEST" | grep -oE '^[0-9]+\.[0-9]+')

          # Update README badge
          sed -i "s/CCS-v[0-9.]*--v[0-9.]*/CCS-v${OLDEST_SHORT}--v${NEWEST_SHORT}/g" README.md

          # Commit if changed
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "📝 docs: auto-update CCS version badge to v${OLDEST_SHORT}--v${NEWEST_SHORT}"
            git push origin main
            echo "✅ README badge updated"
          else
            echo "ℹ️ README badge already up to date"
          fi
