name: Test Action automation
on:
  pull_request:
    paths:
      - 'entrypoint.sh'
      - 'parse-cmake-args.sh'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n entrypoint.sh
